<!DOCTYPE html>
<!-- Soli-boy mockup | section=library | theme=dark | device=desktop | design-system=@soli92/solids | 1280px viewport -->
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soli-boy &mdash; Libreria &middot; Dark &middot; Desktop</title>
<meta name="description" content="Soli-boy mockup | section=library | theme=dark | device=desktop | design-system=@soli92/solids | 1280px viewport">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/solids-theme.css">
</head>
<body>
<h1 class="sr-only">Soli-boy Libreria &mdash; tema Dark, vista Desktop</h1>
<main class="sb-app">
<div class="device device-desktop"><div class="sd-card sb-frame">
    
    <div class="sd-flex sd-items-center sd-between" style="margin-bottom:var(--sd-space-lg);">
      <div class="sd-flex sd-items-center sd-gap-sm">
        <span class="sb-logo"><i class="ti ti-device-gamepad-2" aria-hidden="true"></i></span>
        <span class="sb-title" style="font-size:var(--sd-text-xl);">Soli-boy</span>
      </div>
      <div class="sd-flex sd-gap-sm">
        <button class="sb-btn sb-btn-primary"><i class="ti ti-upload" aria-hidden="true"></i> Carica ROM</button>
        <button class="sb-btn sb-icon" aria-label="Impostazioni"><i class="ti ti-settings" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="sb-search"><i class="ti ti-search" aria-hidden="true"></i>
      <input type="text" placeholder="Cerca un gioco&hellip;" aria-label="Cerca un gioco" /></div>
    <div class="sd-flex sd-gap-sm sd-wrap" style="margin:var(--sd-space-md) 0 var(--sd-space-lg);">
      <span class="sd-badge sb-chip sb-chip-on">Tutti</span>
      <span class="sd-badge sb-chip">GB / GBC</span>
      <span class="sd-badge sb-chip">GBA</span>
      <span class="sd-badge sb-chip">Arcade</span>
    </div>
    <div class="sb-grid" style="grid-template-columns:repeat(5,1fr);">
        <div class="sb-tile"><div class="sb-art a-1"><i class="ti ti-square-rounded" aria-hidden="true"></i></div>
          <p class="sb-tt">Forest Quest</p><p class="sb-mt">GBA &middot; 4 MB</p></div>
        <div class="sb-tile"><div class="sb-art a-2"><i class="ti ti-bolt" aria-hidden="true"></i></div>
          <p class="sb-tt">Pixel Racer</p><p class="sb-mt">GBC &middot; 512 KB</p></div>
        <div class="sb-tile"><div class="sb-art a-3"><i class="ti ti-ghost-2" aria-hidden="true"></i></div>
          <p class="sb-tt">Maze Hunter</p><p class="sb-mt">Arcade &middot; FBNeo</p></div>
        <div class="sb-tile"><div class="sb-art a-4"><i class="ti ti-rocket" aria-hidden="true"></i></div>
          <p class="sb-tt">Star Drift</p><p class="sb-mt">GB &middot; 256 KB</p></div>
        <div class="sb-tile"><div class="sb-art a-5"><i class="ti ti-sword" aria-hidden="true"></i></div>
          <p class="sb-tt">Knight Saga</p><p class="sb-mt">GBA &middot; 8 MB</p></div>
        <div class="sb-tile"><div class="sb-art a-1"><i class="ti ti-droplet" aria-hidden="true"></i></div>
          <p class="sb-tt">Aqua Dive</p><p class="sb-mt">GBC &middot; 1 MB</p></div>
        <div class="sb-tile"><div class="sb-art a-2"><i class="ti ti-flame" aria-hidden="true"></i></div>
          <p class="sb-tt">Turbo Punch</p><p class="sb-mt">Arcade &middot; MAME</p></div>
        <div class="sb-tile"><div class="sb-art a-4"><i class="ti ti-moon" aria-hidden="true"></i></div>
          <p class="sb-tt">Moon Patrol</p><p class="sb-mt">GBA &middot; 4 MB</p></div>
        <div class="sb-tile sb-add"><div><i class="ti ti-plus" aria-hidden="true"></i>
          <p class="sb-mt" style="margin-top:6px;">Aggiungi</p></div></div>
    </div></div></div>
</main>
</body>
</html>
