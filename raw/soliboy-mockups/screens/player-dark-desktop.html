<!DOCTYPE html>
<!-- Soli-boy mockup | section=player | theme=dark | device=desktop | design-system=@soli92/solids | 1280px viewport -->
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soli-boy &mdash; Player &middot; Dark &middot; Desktop</title>
<meta name="description" content="Soli-boy mockup | section=player | theme=dark | device=desktop | design-system=@soli92/solids | 1280px viewport">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/solids-theme.css">
</head>
<body>
<h1 class="sr-only">Soli-boy Player &mdash; tema Dark, vista Desktop</h1>
<main class="sb-app">
<div class="device device-desktop"><div class="sd-card sb-frame">
    
    <div class="sd-flex sd-items-center sd-between" style="margin-bottom:var(--sd-space-lg);">
      <div class="sd-flex sd-items-center sd-gap-sm">
        <span class="sb-logo"><i class="ti ti-device-gamepad-2" aria-hidden="true"></i></span>
        <span class="sb-title" style="font-size:var(--sd-text-xl);">Soli-boy</span>
      </div>
      <div class="sd-flex sd-gap-sm">
        <button class="sb-btn sb-btn-primary"><i class="ti ti-upload" aria-hidden="true"></i> Carica ROM</button>
        <button class="sb-btn sb-icon" aria-label="Impostazioni"><i class="ti ti-settings" aria-hidden="true"></i></button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 280px;gap:var(--sd-space-lg);align-items:start;">
      <div>
        <div class="sb-screen" style="aspect-ratio:16/10;">
          <div style="text-align:center;color:var(--sd-screen-accent);">
            <i class="ti ti-tree" style="font-size:64px" aria-hidden="true"></i>
            <p style="font-size:12px;margin:8px 0 0;letter-spacing:2px;font-family:var(--sd-font-mono);">WORLD 1-2</p>
          </div>
        </div>
        
      <div class="sb-hud" style="margin:var(--sd-space-sm) 0 var(--sd-space-lg);">
        <span><i class="ti ti-bolt" style="font-size:13px;vertical-align:-2px" aria-hidden="true"></i> 60 fps</span>
        <span>GBA &middot; mGBA</span>
        <span><i class="ti ti-device-floppy" style="font-size:13px;vertical-align:-2px" aria-hidden="true"></i> Slot 1</span>
      </div>
        <div class="sd-flex sd-gap-sm" style="margin-top:var(--sd-space-md);">
          <button class="sb-btn"><i class="ti ti-player-pause" aria-hidden="true"></i> Pausa</button>
          <button class="sb-btn"><i class="ti ti-player-track-next" aria-hidden="true"></i> Avanti veloce</button>
          <button class="sb-btn"><i class="ti ti-maximize" aria-hidden="true"></i> Schermo intero</button>
        </div>
      </div>
      <div class="sd-card sb-sec">
        <p class="sb-lbl"><i class="ti ti-device-floppy" aria-hidden="true"></i> Save state</p>
        <div class="sb-row"><span>Slot 1</span><button class="sb-btn" style="min-height:32px;padding:0 10px;font-size:12px;">Carica</button></div>
        <div class="sb-row"><span>Slot 2</span><button class="sb-btn" style="min-height:32px;padding:0 10px;font-size:12px;">Carica</button></div>
        <div class="sb-row"><span>Slot 3 &mdash; vuoto</span><button class="sb-btn" style="min-height:32px;padding:0 10px;font-size:12px;">Salva</button></div>
        <p class="sb-lbl" style="margin-top:var(--sd-space-lg);"><i class="ti ti-device-gamepad" aria-hidden="true"></i> Input</p>
        <p class="sb-mt">Tastiera &amp; gamepad Xbox connesso. I controlli touch non sono mostrati su desktop.</p>
      </div>
    </div></div></div>
</main>
</body>
</html>
