<!DOCTYPE html>
<!-- Soli-boy mockup | section=player | theme=cyberpunk | device=mobile | design-system=@soli92/solids | 390px viewport -->
<html lang="it" data-theme="cyberpunk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soli-boy &mdash; Player &middot; Cyberpunk &middot; Mobile</title>
<meta name="description" content="Soli-boy mockup | section=player | theme=cyberpunk | device=mobile | design-system=@soli92/solids | 390px viewport">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/solids-theme.css">
</head>
<body>
<h1 class="sr-only">Soli-boy Player &mdash; tema Cyberpunk, vista Mobile</h1>
<main class="sb-app">
<div class="device device-mobile"><div class="sb-frame">
    
      <div class="sd-flex sd-items-center sd-between" style="margin-bottom:var(--sd-space-md);">
        <button class="sb-btn sb-icon" aria-label="Indietro"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
        <span class="sb-title" style="font-size:14px;">Forest Quest</span>
        <button class="sb-btn sb-icon" aria-label="Pausa"><i class="ti ti-player-pause" aria-hidden="true"></i></button>
      </div>
    
      <div class="sb-screen" style="aspect-ratio:10/9;">
        <div style="text-align:center;color:var(--sd-screen-accent);">
          <i class="ti ti-tree" style="font-size:46px" aria-hidden="true"></i>
          <p style="font-size:11px;margin:6px 0 0;letter-spacing:1px;font-family:var(--sd-font-mono);">WORLD 1-2</p>
        </div>
      </div>
    
      <div class="sb-hud" style="margin:var(--sd-space-sm) 0 var(--sd-space-lg);">
        <span><i class="ti ti-bolt" style="font-size:13px;vertical-align:-2px" aria-hidden="true"></i> 60 fps</span>
        <span>GBA &middot; mGBA</span>
        <span><i class="ti ti-device-floppy" style="font-size:13px;vertical-align:-2px" aria-hidden="true"></i> Slot 1</span>
      </div>
    
      <div class="sd-flex sd-items-center sd-between" style="margin-bottom:var(--sd-space-lg);">
        <div class="sb-dpad">
          <button class="dp" style="top:0;left:44px;" aria-label="Su"><i class="ti ti-chevron-up" aria-hidden="true"></i></button>
          <button class="dp" style="bottom:0;left:44px;" aria-label="Gi&ugrave;"><i class="ti ti-chevron-down" aria-hidden="true"></i></button>
          <button class="dp" style="top:44px;left:0;" aria-label="Sinistra"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
          <button class="dp" style="top:44px;right:0;" aria-label="Destra"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
          <span class="dp-center"></span>
        </div>
        <div class="sb-ab">
          <button class="ab ab-b" aria-label="Pulsante B">B</button>
          <button class="ab ab-a" aria-label="Pulsante A">A</button>
        </div>
      </div>
      <div class="sd-flex sd-gap-md sd-center">
        <button class="sb-pill">SELECT</button>
        <button class="sb-pill">START</button>
      </div></div></div>
</main>
</body>
</html>
