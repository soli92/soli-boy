# Acceptance-spec soli-boy — flusso: theme switching
# Schema: .claude/schemas/acceptance-spec.schema.yaml (EP-018, ADR-065).
# Flusso: apri ThemeSelector → seleziona "90s-party" → verifica data-theme su html →
#         seleziona "dark" → verifica data-theme
# Selector source:
#   - App.tsx: button[data-tab-id="settings"] (tab navigation)
#   - ThemeSelector.tsx: [data-testid="sb-theme-select"] RadioGroup (aria-label="Tema dell'interfaccia")
#   - useTheme.ts: data-theme su document.documentElement (html element)
#   - Settings.tsx: Accordion trigger "Aspetto — tema UI" (chiuso di default)
# Nota: l'accordion "Aspetto — tema UI" è chiuso di default; occorre aprire il trigger.

app: soliboy
target: http://127.0.0.1:4173/

fixtures: []

scenario:
  - { action: click, selector: 'button:has-text("Ho capito")', optional: true }
  - { action: click, selector: 'button[data-tab-id="settings"]' }
  - { action: wait_for, selector: 'section[aria-label="Impostazioni controlli"]', state: visible, timeout_ms: 5000 }
  - { action: click, selector: 'button:has-text("Aspetto — tema UI")' }
  - { action: wait_ms, value: 300 }
  - { action: wait_for, selector: '[data-testid="sb-theme-select"]', state: visible, timeout_ms: 3000 }
  - { action: click, selector: '[data-testid="sb-theme-select"] label:has-text("90''s Party")' }
  - { action: wait_ms, value: 300 }
  - { action: click, selector: '[data-testid="sb-theme-select"] label:has-text("Dark")' }
  - { action: wait_ms, value: 300 }

assertions:
  - id: data-theme-dark
    severity: blocking
    kind: attr_equals
    selector: 'html'
    attr: 'data-theme'
    value: 'dark'
  - id: theme-select-visible
    severity: blocking
    kind: selector_visible
    selector: '[data-testid="sb-theme-select"]'
  - id: no-console-error
    severity: advisory
    kind: console_no_error

thresholds:
  advisory_max: 1
