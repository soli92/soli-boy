# Acceptance-spec soli-boy — flusso: theme switching
# Schema: .claude/schemas/acceptance-spec.schema.yaml (EP-018, ADR-065).
# Flusso: apri ThemeSelector → seleziona "90s-party" → verifica data-theme su html →
#         seleziona "dark" → verifica data-theme
# Selector source:
#   - App.tsx: button[data-tab-id="settings"] (tab navigation)
#   - ThemeSelector.tsx: select[data-testid="sb-theme-select"] (aria-label="Tema dell'interfaccia")
#   - useTheme.ts: data-theme su document.documentElement (html element)
#   - Settings.tsx: details > summary.sb-lbl "Aspetto — tema UI" (accordion 3, chiuso di default)
# Nota: l'accordion "Aspetto — tema UI" è chiuso di default; occorre cliccare summary per aprirlo.

app: soliboy
target: http://127.0.0.1:4173/

fixtures: []

scenario:
  # Step 0 — dismetti banner privacy se presente
  - { action: click, selector: 'button:has-text("Ho capito")', optional: true }
  # Step 1 — naviga alla tab Impostazioni
  - { action: click, selector: 'button[data-tab-id="settings"]' }
  # Step 2 — attendi il pannello Settings
  - { action: wait_for, selector: 'section[aria-label="Impostazioni controlli"]', state: visible, timeout_ms: 5000 }
  # Step 3 — apri l'accordion "Aspetto — tema UI" (chiuso di default)
  - { action: click, selector: 'summary.sb-lbl:has-text("Aspetto")' }
  - { action: wait_ms, value: 300 }
  # Step 4 — attendi che il select ThemeSelector sia visibile
  - { action: wait_for, selector: 'select[data-testid="sb-theme-select"]', state: visible, timeout_ms: 3000 }
  # Step 5 — seleziona tema "90s-party"
  - { action: fill, selector: 'select[data-testid="sb-theme-select"]', value: '90s-party' }
  - { action: wait_ms, value: 300 }
  # Step 6 — seleziona tema "dark"
  - { action: fill, selector: 'select[data-testid="sb-theme-select"]', value: 'dark' }
  - { action: wait_ms, value: 300 }

assertions:
  # BLOCKING — dopo selezione "dark" l'attributo data-theme="dark" su html
  # (l'ultimo stato del flusso è "dark"; useTheme applica data-theme su document.documentElement)
  - id: data-theme-dark
    severity: blocking
    kind: attr_equals
    selector: 'html'
    attr: 'data-theme'
    value: 'dark'
  # BLOCKING — il select ThemeSelector è visibile (accordion aperto correttamente)
  - id: theme-select-visible
    severity: blocking
    kind: selector_visible
    selector: 'select[data-testid="sb-theme-select"]'
  # ADVISORY — nessun errore console
  - id: no-console-error
    severity: advisory
    kind: console_no_error

thresholds:
  advisory_max: 1
