# Acceptance-spec soli-boy — flusso core: carica ROM → avvia → emulazione gira
# Schema: .claude/schemas/acceptance-spec.schema.yaml (EP-018, ADR-065).
# Il FRAMEWORK possiede lo schema; QUESTO file (contenuto, dominio soli-boy) lo possiede il progetto.
# Fixture: gba-tests-thumb.gba — test ROM mGBA, freely distributable (NO ROM commerciali, ADR-066/TSK-155).

app: soliboy
target: http://127.0.0.1:4317/        # build dist servita (vite preview)

fixtures:
  - id: test-rom
    path: packages/app/public/test-roms/gba-tests-thumb.gba
    load_via:
      selector: 'input[aria-label="Carica ROM"]'
      action: set_input_files

scenario:
  # NB il flusso reale: carica ROM (→ entra in Libreria) → clicca la voce in Libreria (→ monta Player) → Avvia
  - { action: click, selector: 'button:has-text("Ho capito")', optional: true }   # dismetti privacy notice
  - { action: set_input_files, selector: 'input[aria-label="Carica ROM"]', fixture: test-rom }
  - { action: click, selector: 'button:has-text("gba-tests-thumb")' }             # apri dalla Libreria
  - { action: click, selector: 'button:has-text("Avvia")' }
  - { action: wait_for, selector: '[data-testid="sb-canvas-host"] canvas', state: visible, timeout_ms: 15000 }
  - { action: wait_ms, value: 1500 }

assertions:
  # BLOCKING — l'engine è in stato RUNNING. Segnale ROBUSTO: a running il bottone "Avvia" diventa "Pausa".
  # NON usare il testo HUD: a running mostra (title ?? "In esecuzione") → con ROM titolata mostra il TITOLO,
  # non la stringa "In esecuzione" (Player.tsx:320). Era la causa del falso negativo iter-1.
  - id: engine-running
    severity: blocking
    kind: selector_visible
    selector: 'button:has-text("Pausa")'
  - id: avvia-consumed
    severity: blocking
    kind: selector_absent
    selector: 'button:has-text("Avvia")'
  # ADVISORY — canvas_pixel_variance: AFFIDABILE SOLO con fixture ANIMATA. gba-tests-thumb è una test-ROM
  # con schermata risultati statica → variance ~0 ATTESO anche se l'engine gira (frame identici a 60fps).
  # Per un assert blocking di "frame advancing" servirebbe una ROM/demo animata o un frame-counter dell'engine.
  - id: canvas-advancing
    severity: advisory
    kind: canvas_pixel_variance
    selector: '[data-testid="sb-canvas-host"] canvas'
    min_variance: 0.02
    frames: 8
    note: "advisory: richiede fixture animata; con test-ROM statica variance~0 è atteso (non un fail)"
  - id: no-console-error
    severity: advisory
    kind: console_no_error

thresholds:
  advisory_max: 2
