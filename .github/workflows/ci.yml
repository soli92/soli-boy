name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/app

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/app/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: E2e tests (Playwright / Chromium)
        run: npm run e2e:ci

      - name: Upload Playwright report (solo su failure)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/app/playwright-report/
          retention-days: 7

      - name: Build
        run: npm run build

  desktop-dist:
    name: Desktop Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            packages/app/package-lock.json
            packages/desktop/package-lock.json

      - name: Install app dependencies
        working-directory: packages/app
        run: npm ci

      - name: Install desktop dependencies
        working-directory: packages/desktop
        run: npm ci

      - name: Build Linux AppImage (unsigned)
        working-directory: packages/desktop
        run: npm run dist:linux

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: soli-boy-desktop-linux
          path: packages/desktop/release/*.AppImage
          retention-days: 7
          if-no-files-found: error
