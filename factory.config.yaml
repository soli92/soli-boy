# Factory configuration — soli-boy
# PATTERN.md §13 (topology) + §15 (VCS) + §17 (publisher) + §18 (parallel scheduler)
#                          + §19 (code quality review) + §20 (compression layer a due assi)
# Questo file è CONFIG (cambia raramente, sotto controllo umano), non stato.
# Lo stato del progetto resta derivato dal filesystem + wiki/log.md (PATTERN §8).

pattern_version: "2.24"   # bump 2.21→2.24 (2026-06-26): upgrade a v2.23 (Semantic Drift Detection EP-031) + v2.24 (Runtime Contextual Suggestions EP-033).

owner: soli92
language: it

# === Adapter installati (PATTERN §12) =============================================
adapters:
  - name: claude
    folder: .claude
    maturity: full
  - name: cursor
    folder: .cursor
    maturity: full

# Topologia: full-stack-agents → tutti i dev-agent (be/fe/db/qa)
topology: full-stack-agents

# === Code paths (L5) — PATTERN §13 ================================================
code_paths:
  - name: app
    path: ./packages/app
    layers: [be, fe, db, qa]
    tags: [monorepo]
    vcs:
      mode: monorepo
      submodule_path: ""
      remote_url: ""
      branch_strategy: shared
      commit_coupling: float

# Legacy single-repo (non usato — code_paths valorizzato)
code_path: ""
vcs:
  mode: none

# Modalità di scelta dello stack: manual | guided | auto
stack_mode: guided

# Routing TSK → consumer. full-stack-agents: tutti i layer dev su agent.
routing:
  be: agent
  fe: agent
  db: agent
  qa: agent
  infra: human

# Stack scelto (guided: stack-detector propone, owner conferma). Source of truth: raw/tech_stack.md
stack:
  backend: ""
  frontend: ""
  database: ""
  qa: ""
  infra: ""

# Kanban publish (PATTERN §17) — mirror push-only di EP/US/TSK/sprint su GitHub Issues.
kanban_publish:
  provider: github
  target: "soli92/soli-boy"
  auth_env: GH_TOKEN
  mode: push-only
  batch_limit: 10
  mapping:
    epic_to: milestone
    story_to: issue-label
    task_to: issue-label
    sprint_to: milestone
  labels:
    epic: "kanban:epic"
    story: "kanban:story"
    task: "kanban:task"
    layer_prefix: "layer:"
    milestone_prefix: "milestone:"
  filter:
    only_consumer: any
    only_status: any

# Parallel scheduler (PATTERN §18) — DAG-based dispatch.
scheduler:
  enabled: true
  max_parallel: 4
  parallel_gate_threshold: 3
  code_path_conflict: strict
  empty_code_path_policy: serial
  domains:
    ingest:  true
    develop: true
    lint:    true
    query:   true
    plan:    false
    design:  false
    publish: false
    sync:    true
    review:  true
    visual-oracle: true  # v2.17 — sub-step di L2 (develop); attivo perché fe_correctness.enabled: true
    a11y: true           # v2.18 NEW (EP-007 ADR-016 §C) — parallel cross-TSK, serial same-TSK; composto inline con visual-oracle in Modalità 1
    ux-ui-review: true   # v2.18 NEW (EP-008 ADR-020 §C / ADR-019 §Punto 3) — sub-step di L2 (develop), aspetta visual_status non-pending
    functional-oracle: true  # v2.20 NEW EP-018 (ADR-066) — serial same-app, parallel cross-app; attivato da functional_oracle.enabled: true

# Code Quality Review Layer (PATTERN §19) — ON.
code_quality:
  enabled: true
  max_iterations: 3
  thresholds:
    confidence_min: 0.6
    batching_split: 7
    pass_rate_warn: 0.05
    false_positive_warn: 0.30
  passes:
    idiomaticity: true
    design: true
    robustness: true
    accessibility: false          # v2.18 NEW — 4° pass opzionale (invoca run_a11y_scan); indipendente dal dominio scheduler a11y
  router:
    strategy: severity-tiered
    max_diff_lines: 80
    ordering: severity_then_complexity
  ruleset:
    path: ./code_quality/rules/
    tiers: [canonical, emergent, team-specific]
    evolve:
      enabled: false
      cadence_days: 7
  reports:
    path: ./code_quality/reports/
    retain_iterations: 5
    digest_cadence: weekly

# FE Visual Oracle (v2.17, PATTERN §3 variante di Develop FE) — ON.
# Loop di verifica visiva su TSK FE: render headless (Playwright) + screenshot
# multi-viewport/tema + critica multimodale LLM vs spec TSK (evaluator-optimizer,
# come CQRL). Ordering: develop → visual-oracle → review.
#
# enabled            : master switch — Fase 4-bis Visual Verification in dev-protocol
# max_iterations     : bound loop conditional (analogo R.Q4 di CQRL)
# viewports / themes : matrice cartesiana degli screenshot
# checks             : opt-in [visual-regression | axe-a11y | interaction-test] (Fase 3-bis)
# state_matrix_inject: scrivi-task inietta "## DoD FE — stati obbligatori" nei TSK FE
# granularity_lint   : Lint Check 4n WARNING-only su granularità TSK FE
# dispatch_gate      : Orchestrator Oracle Pre-Check FE prima del dispatch
fe_correctness:
  enabled: true
  max_iterations: 3
  viewports:
    - { name: mobile,  width: 375  }
    - { name: desktop, width: 1280 }
  themes:
    - light
    - dark
  checks: []
  state_matrix_inject: false
  granularity_lint: false
  granularity:
    max_estimate_hours: 8
    max_states: 3
  dispatch_gate: false

  # === FE Functional Oracle (v2.20, EP-018, PATTERN §3) — ON ==================
  # Esercita il flusso reale dell'app: serve → fixture → interazione Playwright →
  # asserzioni domain-agnostic → verdict deterministico. Terza forma di correctness FE:
  # Visual Oracle (osserva), UX/UI Review (giudica), Functional Oracle (verifica funziona).
  # Esecutore: qa-dev (fallback fe-dev, ADR-067 §A). Fail-closed: verdict binario dalle
  # asserzioni, critic LLM solo advisory. Dominio scheduler: serial same-app (ADR-066).
  # Acceptance-spec: code_quality/acceptance/*.acceptance.yaml (progetto, non framework).
  functional_oracle:
    enabled: true                 # master switch EP-018
    max_iterations: 3             # loop bound (ADR-067 §C)
    critic: advisory              # advisory (default) | off — mai nel path pass/fail
    acceptance_spec_glob: "code_quality/acceptance/*.acceptance.yaml"

# === Accessibility Testing (v2.18, EP-007, PATTERN §3 operazione Accessibility Scan,
# ADR-014..018) — ON. Pre-screening WCAG 2.2 AA stack-agnostico via tool deterministico
# run_a11y_scan (Playwright + axe-playwright), consumato da accessibility-testing-protocol.
# Riusa l'infra browser headless del FE Visual Oracle (v2.17).
# Regola di neutralità invariante: mai conformità su soli automated_findings (manual_checks N>=1).
#
# enabled              : master switch — abilita Modalità 1/2/3 + comando /a11y
# agent                : gating agente a11y-specialist (Modalità 3 standalone)
# severity_threshold   : critical|major|minor|none — soglia di gating del verdict
# required_on_fe_done  : true → Lint Check 4o WARNING-only (ADR-016 §A)
# fail_ci_on           : critical|critical,major|any|none
# include_interactive  : true → check tastiera/focus/reflow (richiede browser headed)
# fallback_non_web     : snippet-inline (default, ADR-015)
a11y:
  enabled: true
  agent: true                       # a11y-specialist attivo (scelta owner 2026-06-05)
  standard: "wcag22aa"
  severity_threshold: critical      # critical|major|minor|none
  required_on_fe_done: true         # → Lint Check 4o WARNING-only ATTIVO (ADR-016 §A) — gate owner 2026-06-05
  fail_ci_on: critical              # critical|critical,major|any|none
  include_interactive: false
  fallback_non_web: snippet-inline  # ADR-015

# === UX/UI Review & Design (v2.18, EP-008, PATTERN §3 UX/UI Review + UX/UI Design,
# ADR-019/ADR-020 §B) — ON. Critica usabilità su rubrica anti-soggettività (10 euristiche
# Nielsen + 6 dimensioni UI + 5 dimensioni flusso) + produzione deliverable di design.
# Semanticamente distinto dal visual oracle (fe_correctness: «il rendering funziona»):
# ux_ui: valuta «il rendering è UX-buono». No-auto-eval: l'output del designer va SEMPRE
# alla Review (designer e reviewer agenti distinti).
#
# enabled                : master switch — Fase 4-ter dev-protocol + precondition code-review
# max_iterations         : bound loop designer ↔ reviewer (default 3)
# rubric_strict          : true → ogni finding deve avere rubric_ref (fail-loud)
# design_system_path     : path a DS canonico — cascata step 1 (ADR-018)
# default_viewports      : matrice viewport screenshot review UX/UI (ADR-017)
# agents.reviewer/designer: gating agenti opzionali (US-030)
# required_on_fe_done    : true → Lint Check 4p WARNING-only (ADR-020 §G)
# delegate_a11y_to_ep007 : true → ux-ui-reviewer invoca run_a11y_scan (ADR-014)
ux_ui:
  enabled: true
  max_iterations: 3
  rubric_strict: true
  design_system_path: ""
  default_viewports:
    - { name: mobile,  width: 375  }
    - { name: desktop, width: 1280 }
  agents:
    reviewer: true                  # ux-ui-reviewer attivo (scelta owner 2026-06-05)
    designer: true                  # ui-designer attivo (scelta owner 2026-06-05)
  required_on_fe_done: true         # → Lint Check 4p WARNING-only ATTIVO (ADR-020 §G) — gate owner 2026-06-05
  delegate_a11y_to_ep007: true      # ux-ui-reviewer invoca run_a11y_scan (ADR-014)

# === Design Intelligence Layer (v2.21, EP-019, PATTERN §24) — ON ================
# Estende EP-008 (UX/UI) con coordinamento tematico centralizzato.
# Dipendenza: enabled: true richiede ux_ui.enabled: true (fail-loud al boot, ADR-071 §B).
# Regole: R.D1 (no bypass DSL art-director), R.D2 (reasoning-first), R.D3 (critic non oracolo).
#
# enabled                : master switch
# art_director           : gate art-director-coordination + design-rationale (ADR-068)
# generator_tool         : none | plop | yeoman — LLM-Generator Separation (ADR-069)
# critic_enabled         : passo Critic/Judge 6 principi visivi (ADR-070)
# rubric_intention_economy: asse Intention Economy (ADR-070 §E)
design_intelligence:
  enabled: true
  art_director: true              # art-director-coordination-protocol attivo (ADR-068)
  generator_tool: none            # none | plop | yeoman (installa prima il generatore)
  critic_enabled: true            # Critic/Judge Design 6 principi (ADR-070)
  rubric_intention_economy: true  # Intention Economy axis (ADR-070 §E)

# === Compression Layer (PATTERN §20) — ENTRAMBI gli assi ON =======================
compression:
  # --- Asse OUTPUT (Fase 1 OCL — Caveman) ---
  output:
    provider: caveman
    enabled: true
    install_command: "curl -fsSL https://raw.githubusercontent.com/JuliusBrussee/caveman/main/install.sh | bash"
    policy_profile: conservative   # topology full-stack → conservative (R.C3 chain-depth ceiling attivo)
    invariants:                    # R.C1 — non overridabili neppure in custom
      to_user: off
      to_artifact: off
      propagate_resolution: off
    channels:                      # usato SOLO se policy_profile == custom
      orchestrator_to_subagent: full
      subagent_to_tool: ultra
      tool_to_subagent: lite
      subagent_to_orchestrator: full
      sibling_to_sibling: full
      feedback_router_to_devagent: full
    chain_depth_downgrade: true
    chain_depth_threshold: 3
    cross_factory: off             # R.C4
    drift_fallback:                # R.C5
      enabled: true
      markers: [AMBIGUOUS_HANDOFF, REQUEST_CLARIFY]
    audit_trail_for:
      - propagate-resolution
      - feedback-router

  # --- Asse CONTEXT (Fase 2 CCL — Graphify) ---
  context:
    provider: graphify-cloud       # graphify-cloud (default) | graphify-ollama | none
    enabled: true
    package: graphifyy
    install_command: "pip install graphifyy"
    ollama:
      model: llama3.1:8b
      vram_gb_min: 16
    targets:
      - kind: code_path
        name: app
        gitignore_patterns:
          - "*.env"
          - "secrets/**"
    update_strategy: incremental
    full_rebuild_cron: "0 0 * * 0"  # weekly (R.G4 drift mitigation)
    drift_alert_days: 7
    full_rebuild_cost_warn: 5       # USD
    ghost_duplicates_warn: 10
    ci_strategy:
      mode: cache-with-fallback     # R.G4
      cache_provider: actions
      cache_key_prefix: graphify-state
      stale_threshold_hours: 168    # 7 giorni
      full_rebuild_on_demand: true
    confidence_gating:              # R.G2 — per ruolo agent
      executor: [EXTRACTED]                          # be/fe/db/qa-dev
      explorer: [EXTRACTED, INFERRED]                # lead-architect / wiki-query
      reviewer: [EXTRACTED, INFERRED, AMBIGUOUS]     # code-reviewer
    mcp_server:
      enabled: false                # opt-in se runtime MCP disponibile
      topology: per-agent           # per-agent (isolato) | shared
      crg_tools_max: 8

notes: |
  Factory soli-boy generata da factory-bootstrap v2.15 (2026-06-01).
  Upgrade a v2.18 (A11y + UX/UI Integration) il 2026-06-05 — ingest del seed
  raw/factory-bootstrap copy.md (delta v2.18, extends v2-17).
  A11y (EP-007) ON: run_a11y_scan WCAG 2.2 AA via tool a11y-scan.sh (Playwright +
   axe-playwright), agente a11y-specialist attivo. Modalità 1 inline a visual-oracle.
   Regola di neutralità invariante (manual_checks N>=1; non sostituisce audit EAA/ADA).
  UX/UI (EP-008) ON: ux-ui-review-protocol su rubrica + ux-ui-design-protocol; agenti
   ux-ui-reviewer + ui-designer attivi (no-auto-eval enforced). Pipeline FE completa:
   develop → visual-oracle → ux-ui-review → code-review (ADR-019).
   Prerequisito: axe-playwright in packages/app (Playwright già presente da v2.17).
  NB: analytics (EP-009/010) della factory sorgente NON importato (fuori scope v2.18).
  topology full-stack-agents: dev-agent be/fe/db/qa attivi su code_path `app`
  (./packages/app, monorepo). Stack mode guided → stack-detector propone, owner conferma.
  CQRL ON: code-reviewer attivo; popolare code_quality/rules/canonical/ per lo stack
  prima del primo /review.
  kanban_publish github: mirror push-only del kanban su GH Issues/Milestones di
  soli92/soli-boy (richiede `gh auth login` / GH_TOKEN). Source of truth resta
  management/kanban/** (PATTERN §8).
  Compression Layer ENTRAMBI gli assi ON:
   - output (Caveman) conservative: comprime canali messaging agent-to-agent;
     invarianti R.C1 (to_user/to_artifact/propagate_resolution off) non overridabili.
     Smoke test consigliato: /compression dry-run su una wave significativa.
   - context (Graphify-cloud): knowledge graph di packages/app come context
     replacement, confidence-gated. Warm-up: /graphify-sync app (graphify >= 0.8.22 OK).
     Side-channel .graphify-state/ non versionato (R.G6).

# === Task Analytics (PATTERN §21, EP-009/EP-013) — ATTIVATO 2026-06-09 (upgrade v2.19) ===
# Importato per il battle-test v2.19.0-rc (RUN #2/#3 del gate EP-012): il gate richiede
# analytics_events_count > 0 per ogni RUN-REPORT quando dogfooding è on (ADR-041 §C). Misura
# il costo reale degli agenti che sviluppano soli-boy. NB: precedente nota "analytics NON
# importato (fuori scope v2.18)" superata da questo upgrade.
analytics:
  measurement:
    enabled: true                               # master switch EP-009 (ADR-021/022)
    agent: true                                 # analytics-reporter + /analytics
    store: jsonl
    rotation: monthly
    event_store_path: analytics/events          # side-channel gitignored (ADR-021 §A)
    pricing_table_path: analytics/pricing.yaml
    rate_card_path: analytics/rates.yaml
    rate_basis: fully-loaded
  dogfooding:
    enabled: true                               # EP-013: harvest token usage su SessionEnd (hook in .claude/settings.json)
    privacy_policy_path: analytics/PRIVACY.md   # ADR-040 §G
    lock_strategy: flock-advisory               # ADR-039 §A
    lock_timeout_seconds: 5
    idempotency_strategy: hash-compound         # ADR-039 §C

  # --- Token Ledger (v2.21, EP-022) — visibilità economica inline dopo ogni operazione.
  #     Legge i token REALI dal transcript JSONL (message.usage), non stime.
  #     Mostra one-liner ◉ TOKENS ... dopo ogni risposta Claude via hook Stop.
  #     Complementa harvest-session-tokens.py (batch writer EP-013) con display real-time.
  #     Non scrive nell'event store (display-only, nessuna duplicazione eventi EP-013).
  token_ledger:
    enabled: true                 # master switch — hook Stop attivo in settings.json
    display_mode: compact         # compact (one-liner) | full (box con breakdown)
    show_cache_savings: true      # mostra risparmio cache nel one-liner
    auto_call_on_wave_close: false # opt-in: orchestrator chiama --full a wave_close
    pricing_fallback: prefix-based # fallback se pricing.yaml assente

# === Semantic Drift Detection (v2.23, EP-031, PATTERN §25) — opt-in ================
# Monitora la deriva semantica tra pagine wiki e le sezioni PATTERN.md referenziate
# tramite il campo frontmatter `pattern_section: "§N"`.
# Architettura a tre livelli: L1 staleness (always-on, Check 4ag), L2 LLM-judge
# (manuale via /semantic-drift-scan), L3 embedding coseno (opt-in, questo blocco).
# Check 4ag (staleness) è SEMPRE attivo indipendentemente da enabled.
wiki_lint:
  semantic_check:
    enabled: false              # opt-in R.P3 — EP-031 research sprint
    similarity_threshold: 0.75
    embedding_model: voyage-3
    cost_warn_usd: 1.0
    output_report: true
    output_report_path: "code_quality/reports/"
