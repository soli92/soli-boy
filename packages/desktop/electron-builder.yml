# Soli-boy desktop packaging (ADR-007) — electron-builder.
# Renderer = build di @soli-boy/app, riusata 1:1 (nessuna modifica al bundler Vite).
appId: com.soli92.soliboy
productName: Soli-Boy
executableName: soli-boy
artifactName: Soli-Boy-${version}-${os}-${arch}.${ext}
asar: true

directories:
  output: release
  buildResources: build-resources

# main.js + preload.js compilati (build/) + renderer statico in resources/renderer.
files:
  - build/**/*
  - package.json
extraResources:
  - from: ../app/dist
    to: renderer

# Auto-update via GitHub Releases (ADR-008): electron-builder genera latest*.yml.
publish:
  provider: github
  owner: soli92
  repo: soli-boy

# Code signing (ADR-007): electron-builder firma automaticamente quando CSC_LINK +
# CSC_KEY_PASSWORD sono impostati. Senza questi env → build unsigned (fallback US-104).
# Notarization macOS: richiede anche APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID;
# abilitata in CI solo quando i segreti Apple sono configurati (release-desktop.yml).

win:
  target:
    - nsis
  # signAndEditExecutable: default true — signing skipped se CSC_* assenti
nsis:
  oneClick: false
  perMachine: false # per-user → auto-update senza privilegi admin (ADR-007)

mac:
  target:
    - dmg
    - zip # formato consigliato da electron-updater per il delta su macOS
  category: public.app-category.games
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist

linux:
  target:
    - AppImage # auto-update supportato
    - deb # secondario (auto-update non disponibile via apt — limite documentato in ADR-008)
  category: Game
