  <text x="205" y="150" font-family="'DM Sans','Orbitron','Segoe UI',system-ui,-apple-system,Roboto,sans-serif" font-weight="700" font-size="104" textLength="430" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#ff2bd6">S</tspan><tspan fill="#f2ecff">oli</tspan><tspan fill="#00e5ff">-</tspan><tspan fill="#f2ecff">boy</tspan>
