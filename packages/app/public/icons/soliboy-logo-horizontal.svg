<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" aria-label="Soli-boy">
  <title>Soli-boy</title>
  <defs>
    <filter id="sbh-glow-frame" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
      <feFlood flood-color="#7a4fd0" flood-opacity="0.5"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sbh-glow-s" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>

  <!-- mark -->
  <path d="M50 24 H156 A22 22 0 0 1 178 46 V158 A58 58 0 0 1 120 216 H50 A22 22 0 0 1 28 194 V46 A22 22 0 0 1 50 24 Z" fill="#1a1030" stroke="#7a4fd0" stroke-width="4" filter="url(#sbh-glow-frame)"/>
  <rect x="41" y="42" width="124" height="124" rx="16" fill="#241a45"/>
  <rect x="47" y="48" width="112" height="112" rx="10" fill="#080410"/>
  <g shape-rendering="crispEdges" filter="url(#sbh-glow-s)">
