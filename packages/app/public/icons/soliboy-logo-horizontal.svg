    <rect x="68" y="83" width="14" height="14" fill="#ff2bd6"/>
    <rect x="82" y="83" width="14" height="14" fill="#ff2bd6"/>
    <rect x="82" y="97" width="14" height="14" fill="#ff53c9"/>
    <rect x="96" y="97" width="14" height="14" fill="#ff53c9"/>
    <rect x="110" y="97" width="14" height="14" fill="#26c8ec"/>
    <rect x="110" y="111" width="14" height="14" fill="#26c8ec"/>
