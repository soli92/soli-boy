<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Soli-boy app icon">
  <title>Soli-boy app icon</title>
  <defs>
    <filter id="sb-glow-frame" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feFlood flood-color="#7a4fd0" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sb-glow-s" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#140b22"/>

  <!-- handheld body: three tight corners + one big bottom-right corner (Game Boy silhouette) -->
  <path d="M144 54 H368 A44 44 0 0 1 412 98 V338 A120 120 0 0 1 292 458 H144 A44 44 0 0 1 100 414 V98 A44 44 0 0 1 144 54 Z" fill="#1a1030" stroke="#7a4fd0" stroke-width="5" filter="url(#sb-glow-frame)"/>

  <!-- screen bezel + screen -->
  <rect x="132" y="84" width="248" height="248" rx="26" fill="#241a45"/>
  <rect x="140" y="92" width="232" height="232" rx="20" fill="#080410"/>

  <!-- pixel S (magenta -> cyan) -->
  <g shape-rendering="crispEdges" filter="url(#sb-glow-s)">
    <rect x="211" y="103" width="30" height="30" fill="#ff2bd6"/>
    <rect x="241" y="103" width="30" height="30" fill="#ff2bd6"/>
    <rect x="271" y="103" width="30" height="30" fill="#ff2bd6"/>
    <rect x="301" y="103" width="30" height="30" fill="#ff53c9"/>
    <rect x="181" y="133" width="30" height="30" fill="#ff2bd6"/>
    <rect x="211" y="133" width="30" height="30" fill="#ff2bd6"/>
    <rect x="181" y="163" width="30" height="30" fill="#ff2bd6"/>
    <rect x="211" y="163" width="30" height="30" fill="#ff2bd6"/>
    <rect x="211" y="193" width="30" height="30" fill="#ff53c9"/>
    <rect x="241" y="193" width="30" height="30" fill="#ff53c9"/>
    <rect x="271" y="193" width="30" height="30" fill="#26c8ec"/>
    <rect x="271" y="223" width="30" height="30" fill="#26c8ec"/>
    <rect x="301" y="223" width="30" height="30" fill="#00e5ff"/>
    <rect x="271" y="253" width="30" height="30" fill="#00e5ff"/>
    <rect x="301" y="253" width="30" height="30" fill="#00e5ff"/>
    <rect x="181" y="283" width="30" height="30" fill="#26c8ec"/>
    <rect x="211" y="283" width="30" height="30" fill="#26c8ec"/>
    <rect x="241" y="283" width="30" height="30" fill="#00e5ff"/>
    <rect x="271" y="283" width="30" height="30" fill="#00e5ff"/>
  </g>

  <!-- A / B buttons (diagonal, like a handheld) -->
  <circle cx="214" cy="400" r="17" fill="#00e5ff"/>
  <circle cx="298" cy="378" r="17" fill="#faff00"/>
</svg>
